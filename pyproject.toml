[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daoh-prediction"
version = "0.1.0"
description = "OrdBoost for predicting days alive and out of hospital (DAOH90)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Models and metrics
    "medpipe>=0.4.1",
    "ordboost>=0.6.1",
    "mord",
    "ngboost",
    "properscoring",
    "scores",
    "scikit-learn",
    "scipy",
    # Data and plotting
    "numpy",
    "pandas",
    "xarray",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pandas-stubs",
]

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
