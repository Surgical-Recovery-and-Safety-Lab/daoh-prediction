[meta]
project_name = "20-bins"
run_mode = "cv"
verbose = "info"

[data]
path = "/pvol/mroe734/data/NZ_data.v2.parquet"
predictors = [
  "AGE",
  "SEX",
  "PRIOR_CANCER",
  "ETHNICITY",
  "ASA",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
  "CATEGORY_LEVEL_2",
  "OP_SEVERITY",
  "TRAUMA",
]
outcomes = ["DAOH_90"]

# ------------------------------------------------------------------------------
# DEFAULT MODEL SETUP
# ------------------------------------------------------------------------------
[default_model]
algorithm = "OrdBoostRegressor"

[default_model.hyperparameters]
learning_rate = 0.1
bin_strategy = "uniform"
n_bins = 20
mapper = "uniform"
loss = "log_loss"
monotonicity = "isotonic"
max_iter = 100
max_leaf_nodes = 512
min_samples_leaf = 512

[default_model.hyperparameters.mapper_kwargs]
n_points = 0
floor_atom = true
ceiling_atom = true
lower_bound = 0
upper_bound = 89

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------
[workflow]
random_state = 42
n_jobs = 1

[workflow.preprocessing]
preprocess = true
operations = [
  { name = "OrdinalEncoder", columns = [
    "SEX",
    "ETHNICITY",
    "ADMISSION_ACUITY",
    "ADMISSION_SOURCE",
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
    "ASA",
    "OP_SEVERITY",
    "PRIOR_CANCER",
    "TRAUMA",
  ] },
]

[workflow.validation.test_split]
strategy = "group"
group_column = "OP_YEAR"
values = [2023, 2024]

[workflow.validation.cross_validation]
strategy = "random"
grid_search = false
n_splits = 10
shuffle = true

[workflow.evaluation.metrics]
metrics = ["crps"]
n_bootstraps = 1000
ci_level = 0.95
