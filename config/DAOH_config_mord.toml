[meta]
project_name = "mord"
run_mode = "cv"
verbose = "info"

[data]
path = "/pvol/mroe734/data/NZ_data.v2.parquet"
predictors = [
  "AGE",
  "SEX",
  "PRIOR_CANCER",
  "ETHNICITY",
  "ASA",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
  "CATEGORY_LEVEL_2",
  "OP_SEVERITY",
  "TRAUMA",
]
outcomes = ["DAOH_90"]

# ------------------------------------------------------------------------------
# DEFAULT MODEL SETUP
# ------------------------------------------------------------------------------
[default_model]
algorithm = "OrdinalRidge"

[default_model.hyperparameters]
max_iter = 100

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------
[workflow]
random_state = 42
n_jobs = 2

[workflow.preprocessing]
preprocess = true
operations = [
  { name = "SimpleImputer", columns = ["ASA", "OP_SEVERITY"], strategy = "most_frequent", add_indicator = true },
  { name = "OneHotEncoder", columns = [
    "SEX",
    "TRAUMA",
    "PRIOR_CANCER",
    "ETHNICITY",
    "ADMISSION_ACUITY",
    "ADMISSION_SOURCE",
  ], sparse_output = false },
  { name = "TargetEncoder", target_type = "continuous", smooth = "auto", columns = [
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
  ] },
  { name = "StandardScaler", columns = [
    "AGE",
    "ASA",
    "OP_SEVERITY",
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
  ] },
]

[workflow.validation.test_split]
strategy = "group"
group_column = "OP_YEAR"
values = [2023, 2024]

[workflow.validation.cross_validation]
strategy = "random"
grid_search = false
n_splits = 10
shuffle = true

[workflow.evaluation.metrics]
metrics = ["mae"]
n_bootstraps = 1000
ci_level = 0.95
