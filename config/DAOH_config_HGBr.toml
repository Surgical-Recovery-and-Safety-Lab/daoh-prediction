[meta]
project_name = "hgbr"
run_mode = "cv"
verbose = "info"

[data]
path = "/pvol/mroe734/data/NZ_data.v2.parquet"
predictors = [
  "AGE",
  "SEX",
  "PRIOR_CANCER",
  "ETHNICITY",
  "ASA",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
  "CATEGORY_LEVEL_2",
  "OP_SEVERITY",
  "TRAUMA",
]
outcomes = ["DAOH_90"]

# ------------------------------------------------------------------------------
# DEFAULT MODEL SETUP
# ------------------------------------------------------------------------------
[default_model]
algorithm = "HistGradientBoostingRegressor"

[default_model.hyperparameters]
loss = "absolute_error"
learning_rate = 0.1
max_iter = 100
max_leaf_nodes = 512
min_samples_leaf = 512

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------
[workflow]
random_state = 42
n_jobs = 2

[workflow.preprocessing]
preprocess = true
operations = [
  { name = "OrdinalEncoder", columns = [
    "SEX",
    "ETHNICITY",
    "ADMISSION_ACUITY",
    "ADMISSION_SOURCE",
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
  ] },
]

[workflow.validation.test_split]
strategy = "group"
group_column = "OP_YEAR"
values = [2023, 2024]

[workflow.validation.cross_validation]
strategy = "random"
grid_search = false
n_splits = 10
shuffle = true

[workflow.evaluation.metrics]
metrics = ["mae"]
n_bootstraps = 1000
ci_level = 0.95
