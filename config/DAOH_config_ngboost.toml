[meta]
project_name = "ngboost"
run_mode = "cv"
verbose = "info"

[data]
path = "/pvol/mroe734/data/NZ_data.v2.1.pq"
predictors = [
  "AGE",
  "SEX_ORIGINAL",
  "PRIOR_CANCER",
  "ETHNICITY_ORIGINAL",
  "ASA_ORIGINAL",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
  "CATEGORY_LEVEL_2",
  "OP_SEVERITY",
  "TRAUMA",
]
outcomes = ["DAOH_90"]

# ------------------------------------------------------------------------------
# DEFAULT MODEL SETUP
# ------------------------------------------------------------------------------
[default_model]
algorithm = "NGBRegressor"

[default_model.hyperparameters]
learning_rate = 0.1
early_stopping_rounds = 10
n_estimators = 100

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------
[workflow]
random_state = 42
n_jobs = 10

[workflow.preprocessing]
preprocess = true
operations = [
  { name = "OrdinalEncoder", columns = [
    "SEX_ORIGINAL",
    "ETHNICITY_ORIGINAL",
    "ADMISSION_ACUITY",
    "ADMISSION_SOURCE",
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
    "ASA_ORIGINAL",
    "OP_SEVERITY",
    "PRIOR_CANCER",
    "TRAUMA",
  ] },
]

[workflow.validation.test_split]
strategy = "group"
group_column = "OP_YEAR"
values = [2023, 2024]

[workflow.validation.cross_validation]
strategy = "random"
grid_search = false
n_splits = 10
shuffle = true

[workflow.evaluation.metrics]
metrics = ["crps_ngboost", "mae"]
n_bootstraps = 1000
ci_level = 0.95
